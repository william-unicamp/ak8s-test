apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meu-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/william-unicamp/ak8s-test.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: ak8s-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
